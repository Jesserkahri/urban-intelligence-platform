# Urban Intelligence Platform - Application Configuration

# Application Info
app.name=Urban Intelligence Platform
app.version=1.0.0
app.description=Intelligent civic analytics platform for urban operations and sustainability

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.tomcat.max-http-response-header-size=32KB
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Spring Boot Configuration
spring.application.name=urban-intelligence-platform
spring.profiles.active=dev

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# PostgreSQL DataSource Configuration
# NOTE: Update these values for your environment
spring.datasource.url=jdbc:postgresql://localhost:5432/urban_intelligence_db
spring.datasource.username=urban_user
spring.datasource.password=secure_password_here
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging Configuration
logging.level.root=INFO
logging.level.com.urban.intelligence.platform=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/urban-intelligence-platform.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10

# Jackson Configuration (JSON Serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
app.jwt.secret=${JWT_SECRET:urban-intelligence-platform-secure-secret-key-min-256-bits}
app.jwt.expiration=86400000
app.jwt.issuer=urban-intelligence-platform
app.jwt.audience=urban-platform-client

# Actuator / Metrics (Spring Boot Admin integration ready)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# API Documentation (OpenAPI 3.0 / Swagger integration ready)
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Application Properties
app.analytics.hotspot-threshold=5.0
app.analytics.cluster-radius=0.05
app.analytics.incident-density-threshold=10.0



