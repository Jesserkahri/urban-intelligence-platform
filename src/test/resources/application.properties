# Test configuration — uses H2 in-memory database
spring.application.name=urban-intelligence-platform-test

# H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA + H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable Flyway for tests (H2 compatibility)
spring.flyway.enabled=false

# JWT config for tests
app.jwt.secret=test-secret-key-for-integration-tests-min-256-bits-long
app.jwt.expiration=86400000
app.jwt.refresh-expiration=2592000000
app.jwt.issuer=urban-intelligence-platform-test
app.jwt.audience=urban-platform-test-client

# Logging
logging.level.root=WARN
logging.level.com.urban.intelligence.platform=DEBUG