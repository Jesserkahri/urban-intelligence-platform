# Urban Intelligence Platform - Application Configuration
# Environment-based configuration using Spring Boot externalized config
# All secrets come from environment variables, never hardcoded

# Application Info
app.name=Urban Intelligence Platform
app.version=1.0.0
app.description=Intelligent civic analytics platform for urban operations and sustainability

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}
server.tomcat.max-http-response-header-size=32KB
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Spring Boot Configuration
spring.application.name=urban-intelligence-platform

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# PostgreSQL DataSource Configuration - from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urban_intelligence_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:urban_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secure_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging Configuration
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.urban.intelligence.platform=${LOGGING_LEVEL_COM_URBAN_INTELLIGENCE_PLATFORM:INFO}
logging.level.org.springframework=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
logging.level.org.hibernate=${LOGGING_LEVEL_ORG_HIBERNATE:WARN}

# JWT Configuration - from environment variables
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=${JWT_ISSUER:urban-intelligence-platform}
app.jwt.audience=${JWT_AUDIENCE:urban-platform-client}

# CORS Configuration - from environment variables
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Jackson Configuration (JSON Serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# API Documentation (OpenAPI 3.0 / Swagger)
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Application Properties
app.analytics.hotspot-threshold=5.0
app.analytics.cluster-radius=0.05
app.analytics.incident-density-threshold=10.0
