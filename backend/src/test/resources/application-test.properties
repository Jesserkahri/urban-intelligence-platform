# Test profile configuration — overrides application.properties when @ActiveProfiles("test") is set
spring.application.name=urban-intelligence-platform-test

# H2 in-memory database for tests (no Docker required)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable Flyway — Hibernate DDL handles schema in test
spring.flyway.enabled=false

# Fixed JWT secret for tests (256-bit key = 32+ chars)
app.jwt.secret=test-secret-key-32chars-min-for-hs256-ok
app.jwt.expiration=900000
app.jwt.refresh-expiration=2592000000
app.jwt.issuer=urban-intelligence-platform-test
app.jwt.audience=urban-platform-test-client

# Logging
logging.level.root=WARN
logging.level.com.urban.intelligence.platform=DEBUG

# CORS
app.cors.allowed-origins=http://localhost:3000