# Test profile defaults. Spring integration tests must extend BaseIntegrationTest,
# which supplies PostgreSQL Testcontainers connection properties and enables Flyway.
spring.application.name=urban-intelligence-platform-test

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=test-secret-key-for-integration-tests-min-256-bits-long
app.jwt.expiration=86400000
app.jwt.refresh-expiration=2592000000
app.jwt.issuer=urban-intelligence-platform-test
app.jwt.audience=urban-platform-test-client

logging.level.root=WARN
logging.level.com.urban.intelligence.platform=INFO
