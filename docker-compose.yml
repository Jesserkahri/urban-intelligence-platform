version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urban_platform
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urban_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban -d urban_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend # ← updated
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urban_platform
      SPRING_DATASOURCE_USERNAME: urban
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-urban_secret}
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      APP_JWT_EXPIRATION: 900000
      APP_JWT_REFRESH_EXPIRATION: 604800000
      LOGGING_LEVEL_COM_URBAN_INTELLIGENCE: DEBUG
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
