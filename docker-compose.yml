version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: urban-intelligence-db
    environment:
      POSTGRES_DB: urban_intelligence_db
      POSTGRES_USER: urban_user
      POSTGRES_PASSWORD: secure_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban_user -d urban_intelligence_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urban-network

  app:
    build: .
    container_name: urban-intelligence-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urban_intelligence_db
      SPRING_DATASOURCE_USERNAME: urban_user
      SPRING_DATASOURCE_PASSWORD: secure_password_here
      APP_JWT_SECRET: urban-intelligence-platform-secret-key-docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urban-network

volumes:
  postgres_data:

networks:
  urban-network:
    driver: bridge
