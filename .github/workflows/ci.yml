name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: test-secret-key-for-ci-min-256-bits-long-value

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn -B clean package -DskipTests

      - name: Verify Docker availability for Testcontainers
        run: docker info

      - name: Run tests
        run: mvn -B test

      - name: Print surefire failure reports
        if: failure()
        run: |
        find target/surefire-reports -name "*.txt" | head -5 | xargs cat

      - name: Build Docker image (validate only)
        run: docker build -t urban-intelligence-platform --platform linux/amd64 .
